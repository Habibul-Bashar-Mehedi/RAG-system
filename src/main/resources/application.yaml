spring:
  application:
    name: RagSystem
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rag-system}
    username: ${POSTGRES_USER:lemon}
    password: ${POSTGRES_PASSWORD:lemon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}
  mvc:
    async:
      request-timeout: 120s

server:
  port: ${SERVER_PORT:8089}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

rag:
  chunking:
    size: ${CHUNK_SIZE:800}
    overlap: ${CHUNK_OVERLAP:150}
    min-chars: ${CHUNK_MIN_CHARS:40}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:5}
    min-score: ${RETRIEVAL_MIN_SCORE:0.2}
  vector-store:
    type: ${VECTOR_STORE_TYPE:qdrant}
    collection: ${QDRANT_COLLECTION:rag_chunks}
  embedding:
    base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${EMBEDDING_DIMENSION:1536}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
    max-batch: ${EMBEDDING_MAX_BATCH:32}
  llm:
    base-url: ${LLM_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
    temperature: ${LLM_TEMPERATURE:0.0}
  qdrant:
    base-url: ${QDRANT_URL:http://localhost:6333}
    timeout-seconds: ${QDRANT_TIMEOUT_SECONDS:10}
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}
    max-size-mb: 20
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${RETRY_BACKOFF_MS:500}
