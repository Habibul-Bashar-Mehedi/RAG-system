spring:
  datasource:
    url: jdbc:h2:mem:ragtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

rag:
  vector-store:
    type: memory
  upload:
    dir: build/test-uploads
  embedding:
    base-url: http://localhost:1/v1
    api-key: test-key
    model: test-embedding
    dimension: 3
  llm:
    base-url: http://localhost:1/v1
    api-key: test-key
    model: test-llm
  retrieval:
    top-k: 5
    min-score: 0.0
  retry:
    max-attempts: 1
    backoff-ms: 0
